
[project]
name = "deauville-starter-main"
version = "0.1.0"
description = "Festival management system for Deauville Festival du Rire 2027"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["festival"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
